<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Заказы</title>
</head>

<body>

<h1>Все заказы</h1>

<table border="1">
<tr>
<th>ID</th>
<th>Имя</th>
<th>Телефон</th>
<th>Торт</th>
<th>Размер</th>
<th>Дата</th>
</tr>

{% for order in orders %}

<tr>
<td>{{ order.id }}</td>
<td>{{ order.customer_name }}</td>
<td>{{ order.phone }}</td>
<td>{{ order.cake_code }}</td>
<td>{{ order.size_cm }} см</td>
<td>{{ order.created_at }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
